name: Export code-only PDFs for Proximo and Fenetre Ouverte

on:
  workflow_dispatch:
  push:
    branches:
      - feat/wordpress-official-publishing-2026-11-04
    paths:
      - ".github/workflows/export-code-pdfs.yml"
      - "scripts/export_changed_code_pdfs.py"

jobs:
  export_code:
    name: Compile changed code into PDFs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch the frozen refactor baseline
        run: |
          git fetch --no-tags origin +refs/heads/refactor/lot1-domain-extraction:refs/remotes/origin/refactor/lot1-domain-extraction
          git rev-parse origin/refactor/lot1-domain-extraction
          git rev-parse HEAD
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PDF typesetting library
        run: |
          python -m pip install --no-cache-dir reportlab==4.4.4
      - name: Generate four code-only PDFs
        env:
          CODE_PDF_BASE: origin/refactor/lot1-domain-extraction
          CODE_PDF_DIR: code_artifacts
        run: python scripts/export_changed_code_pdfs.py
      - name: Validate generated PDFs
        run: |
          python - <<'PY'
          from pathlib import Path
          from reportlab.pdfbase.pdfdoc import PDFCatalog
          paths = list(Path("code_artifacts").glob("*.pdf"))
          assert len(paths) == 4, paths
          for path in paths:
              data = path.read_bytes()
              assert data.startswith(b"%PDF-"), path
              assert b"%%EOF" in data[-512:], path
              print(path, len(data))
          PY
      - name: Upload PDFs for review
        uses: actions/upload-artifact@v4
        with:
          name: code-only-pdfs-proximo-fenetre-ouverte
          path: code_artifacts/*.pdf
          retention-days: 30
          if-no-files-found: error
