name: Gazette A4 visual QA

on:
  pull_request:
    paths:
      - "apps/fenetre-ouverte/frontend/**"
      - ".github/workflows/gazette-visual-qa.yml"
  workflow_dispatch:

jobs:
  chromium_print:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/fenetre-ouverte/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/fenetre-ouverte/frontend/package-lock.json

      - name: Install frontend
        run: npm ci
      - name: Install temporary Chromium QA dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium

      - name: Launch development-only print fixture
        run: |
          nohup npm run dev -- --host 127.0.0.1 > /tmp/gazette-vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/__qa/gazette-print >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/gazette-vite.log
          exit 1

      - name: Print and validate sample A4 PDF
        run: node qa/gazette-print.mjs

      - name: Upload proof PDFs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gazette-a4-visual-proof
          path: |
            apps/fenetre-ouverte/frontend/qa-output/*.pdf
            apps/fenetre-ouverte/frontend/qa-output/*.png
          if-no-files-found: warn
          retention-days: 7
