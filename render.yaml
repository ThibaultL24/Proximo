# render.yaml
databases:
  - name: fenetre-ouverte-db
    plan: starter
    region: frankfurt
    postgresMajorVersion: 16

services:
  - type: web
    name: fenetre-ouverte
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fenetre-ouverte-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_CLIENT_MONTHLY
        sync: false
      - key: STRIPE_PRICE_MERCHANT_MONTHLY
        sync: false
      - key: STRIPE_PRICE_AGENCY_MONTHLY
        sync: false
