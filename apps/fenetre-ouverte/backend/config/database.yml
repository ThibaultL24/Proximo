# Base PostgreSQL propre à fenetre-ouverte. N'utilisez jamais la base de l'autre application.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  url: <%= ENV.fetch("FENETRE_OUVERTE_DATABASE_URL", "postgresql:///fenetre_ouverte_development") %>

test:
  <<: *default
  url: <%= ENV.fetch("FENETRE_OUVERTE_TEST_DATABASE_URL", "postgresql:///fenetre_ouverte_test") %>

production:
  <<: *default
  url: <%= ENV["FENETRE_OUVERTE_DATABASE_URL"] %>
